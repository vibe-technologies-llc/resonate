name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: ""
  ARCH_PACKAGES: >-
    base-devel git rustup clang pkgconf pipewire libpipewire wayland libxkbcommon libxkbcommon-x11
    fontconfig freetype2 ttf-dejavu vulkan-headers vulkan-icd-loader ffmpeg flac wavpack mac lame dbus
    webkit2gtk-4.1 cargo-nextest chromaprint

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: "false"
      - run: cargo xtask lint --locked --verbose

  headless:
    name: Tests without the window
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: dbus-run-session -- cargo nextest run --locked --profile ci --workspace --exclude resonate-ui --no-default-features
        env:
          RESONATE_MPRIS_BUS_TESTS: required
          RESONATE_TERMINAL_TESTS: required
          RESONATE_PIPEWIRE_HOSTED_TESTS: required
          RESONATE_LISTEN_HOSTED_TESTS: required
          RESONATE_CODEC_ENCODED_TESTS: required
          RESONATE_ANALYSIS_REFERENCES_TESTS: required
          RESONATE_DSP_RESTORATION_TESTS: required
          RESONATE_LIBRARY_FFMPEG_TESTS: required
          RESONATE_VAULT_TESTS: required
          RESONATE_ENGINE_FFMPEG_TESTS: required

  workspace:
    name: Tests with everything
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo nextest run --locked --profile ci -p resonate -p resonate-ui
        env:
          RESONATE_TERMINAL_TESTS: required

  costs:
    name: DSP costs under their ceilings
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo bench --locked -p resonate-dsp --bench stages
        env:
          RESONATE_BENCH_CEILINGS: "1"

  layering:
    name: Crate layering
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install what cargo tree needs
        run: pacman -Syu --noconfirm --needed git rustup
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Refuse the dependencies each crate must stay free of
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          held_by() {
            cargo tree --locked "$@" --prefix none --format '{p}' | awk '{print $1}' | sort -u
          }
          check() {
            local named=$1 held=$2
            shift 2
            for banned in "$@"; do
              if grep -qx "$banned" <<<"$held"; then
                echo "::error::$named depends on $banned"
                failed=1
              fi
            done
          }
          refuse() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate")
            check "$crate" "$held" "$@"
          }
          refuse_headless() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate" --no-default-features)
            check "$crate without its default features" "$held" "$@"
          }
          refuse_shipped() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate" -e normal)
            check "$crate as shipped" "$held" "$@"
          }
          workspace_crates() {
            printf '%s\n' "$1" | grep '^resonate' | grep -vx "$2" || true
          }
          only() {
            local crate=$1 held reached
            shift
            held=$(held_by -p "$crate" -e normal)
            for reached in $(workspace_crates "$held" "$crate"); do
              if ! printf '%s\n' "$@" | grep -qx "$reached"; then
                echo "::error::$crate reaches $reached"
                failed=1
              fi
            done
          }
          reached_only_by() {
            local crate=$1 held by
            shift
            held=$(held_by --workspace -i "$crate")
            for by in $(workspace_crates "$held" "$crate"); do
              if ! printf '%s\n' "$@" | grep -qx "$by"; then
                echo "::error::$crate is reached by $by"
                failed=1
              fi
            done
          }
          reached_by_the_binary_alone() {
            reached_only_by "$1" resonate
          }
          only_on() {
            local target=$1 crate=$2 held reached
            shift 2
            held=$(held_by -p "$crate" --target "$target" -e normal)
            for reached in $(workspace_crates "$held" "$crate"); do
              if ! printf '%s\n' "$@" | grep -qx "$reached"; then
                echo "::error::$crate on $target reaches $reached"
                failed=1
              fi
            done
          }
          reached_directly_on() {
            local target=$1 crate=$2 held by
            shift 2
            held=$(held_by --workspace -i "$crate" --target "$target" --depth 1)
            for by in $(workspace_crates "$held" "$crate"); do
              if ! printf '%s\n' "$@" | grep -qx "$by"; then
                echo "::error::$crate on $target is reached by $by"
                failed=1
              fi
            done
          }
          refuse resonate-core symphonia pipewire gpui serde
          refuse resonate-library ureq serde serde_json quinn tokio
          refuse resonate-eq gpui resonate-engine resonate-library ureq
          refuse resonate-vault gpui resonate-engine resonate-library ureq
          refuse resonate-codec resonate-dsp resonate-pipewire
          refuse resonate-dsp resonate-eq resonate-codec resonate-pipewire
          refuse resonate-pipewire resonate-codec resonate-dsp
          refuse resonate-providers gpui
          refuse resonate-fetch gpui
          refuse resonate-inbox gpui
          refuse resonate-jellyfin gpui
          refuse resonate-subsonic gpui
          refuse resonate-tidal gpui
          refuse resonate-monochrome gpui
          refuse resonate-ytmusic gpui
          refuse resonate-dlna gpui
          only resonate-words
          only resonate-words-build
          only resonate-providers resonate-core resonate-words
          only resonate-fetch resonate-core resonate-providers resonate-words
          only resonate-inbox resonate-core resonate-providers resonate-words
          only resonate-jellyfin resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-subsonic resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-tidal resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-monochrome resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-ytmusic resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-dlna resonate-core resonate-providers resonate-upnp resonate-audio resonate-words
          held=$(held_by -p resonate-dlna -e normal)
          check "resonate-dlna" "$held" ureq rustls serde serde_json resonate-fetch
          reached_by_the_binary_alone resonate-dlna
          only resonate-audio resonate-core resonate-words
          refuse resonate-audio pipewire libspa resonate-codec resonate-dsp gpui
          only resonate-upnp resonate-core resonate-audio resonate-words
          held=$(held_by -p resonate-upnp -e normal)
          check "resonate-upnp outside its tests" "$held" \
            pipewire libspa gpui ureq serde rustls rusqlite
          only resonate-cast resonate-core resonate-audio resonate-upnp resonate-words
          held=$(held_by -p resonate-cast -e normal)
          check "resonate-cast outside its tests" "$held" \
            pipewire libspa gpui ureq serde serde_json
          reached_only_by resonate-cast resonate resonate-mobile
          refuse resonate-bindgen resonate-core resonate-engine pipewire gpui
          refuse resonate-analysis gpui resonate-engine resonate-library ureq
          refuse resonate-discord gpui resonate-library ureq
          refuse resonate-listen gpui ureq
          only resonate-listen resonate-core resonate-audio resonate-pipewire resonate-words
          refuse resonate-lyrics gpui resonate-engine resonate-library ureq
          refuse resonate-mpris gpui resonate-library
          held=$(held_by -p resonate-mpris -e normal --depth 1)
          check "resonate-mpris outside its tests" "$held" resonate-codec
          refuse resonate-mcp gpui resonate-ui resonate-online
          reached_only_by resonate-online resonate resonate-mobile
          refuse resonate-musicbrainz gpui resonate-engine resonate-online resonate-sync ureq serde serde_json quinn tokio
          reached_only_by resonate-musicbrainz resonate resonate-mobile
          refuse resonate-sync gpui resonate-library resonate-engine ureq serde serde_json
          only resonate-sync resonate-core resonate-words
          refuse_headless resonate-sync mdns-sd if-addrs rcgen
          refuse resonate-server gpui resonate-library resonate-engine
          refuse_shipped resonate-server mdns-sd if-addrs rcgen
          only resonate-server resonate-core resonate-sync resonate-providers resonate-fetch resonate-tidal resonate-words
          reached_only_by resonate-sync resonate resonate-driven resonate-mobile resonate-server
          refuse resonate-driven gpui resonate-library ureq serde serde_json
          reached_only_by resonate-driven resonate resonate-mobile
          reached_by_the_binary_alone resonate-mcp
          reached_by_the_binary_alone resonate-discord
          refuse_headless resonate serde_json gpui ureq quinn tokio
          refuse resonate wry tao webkit2gtk webview2-com
          refuse_headless resonate wry tao webkit2gtk webview2-com
          only resonate-signin resonate-core resonate-words
          reached_by_the_binary_alone resonate-signin
          only resonate-cli resonate-words
          reached_by_the_binary_alone resonate-cli
          refuse resonate-pipewire resonate-wasapi
          refuse resonate-wasapi resonate-codec resonate-dsp resonate-pipewire pipewire libspa gpui
          only resonate-wasapi resonate-core resonate-audio resonate-words
          only_on x86_64-pc-windows-msvc resonate-win32
          reached_directly_on x86_64-pc-windows-msvc resonate-win32 resonate resonate-wasapi resonate-codec resonate-mpris resonate-discord
          only resonate-linux
          reached_directly_on x86_64-unknown-linux-gnu resonate-linux resonate-codec
          held=$(held_by -p resonate-listen --target x86_64-pc-windows-msvc -e normal)
          check "resonate-listen on Windows" "$held" \
            resonate-pipewire resonate-wasapi pipewire libspa gpui ureq
          held=$(held_by -p resonate --target x86_64-pc-windows-msvc)
          check "resonate on Windows" "$held" \
            resonate-pipewire pipewire libspa wayland-client wayland-protocols rustix resonate-linux
          held=$(held_by -p resonate-mobile --target aarch64-apple-ios)
          check "resonate-mobile on iOS" "$held" \
            resonate-pipewire pipewire libspa gpui resonate-mpris resonate-discord oboe
          refuse resonate-coreaudio resonate-codec resonate-dsp resonate-pipewire resonate-wasapi pipewire libspa gpui
          only resonate-coreaudio resonate-core resonate-audio resonate-apple resonate-words
          only_on aarch64-apple-darwin resonate-coreaudio resonate-core resonate-audio resonate-apple resonate-words
          only_on aarch64-apple-darwin resonate-apple
          only_on aarch64-apple-ios resonate-apple
          reached_directly_on aarch64-apple-darwin resonate-apple resonate-codec resonate-coreaudio resonate-listen resonate-mobile resonate-mpris
          reached_directly_on aarch64-apple-ios resonate-apple resonate-coreaudio resonate-mobile
          only_on aarch64-apple-darwin resonate-listen resonate-core resonate-audio resonate-apple resonate-dsp resonate-words
          held=$(held_by -p resonate-listen --target aarch64-apple-darwin -e normal)
          check "resonate-listen on macOS" "$held" \
            resonate-pipewire resonate-wasapi resonate-coreaudio pipewire libspa gpui ureq
          held=$(held_by -p resonate --target aarch64-apple-darwin)
          check "resonate on macOS" "$held" \
            resonate-pipewire resonate-wasapi resonate-win32 resonate-linux pipewire libspa wayland-client wayland-protocols wasapi windows
          exit "$failed"

  windows:
    name: Windows clippy
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+crt-static
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v7
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 60GB
          workspace-copy: true
          trusted-dev-drive: true
      - name: Install the pinned toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          shared-key: windows
          save-if: "false"
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo xtask lint --locked --verbose

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+crt-static
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v7
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 60GB
          workspace-copy: true
          trusted-dev-drive: true
      - name: Install the pinned toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          shared-key: windows
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo nextest run --locked --profile ci --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --no-default-features
      - if: ${{ !cancelled() }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo nextest run --locked --profile ci -p resonate --no-default-features --features mcp -E 'test(/^signals::/)'

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=generic -C target-feature=+crt-static
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v7
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 60GB
          workspace-copy: true
          trusted-dev-drive: true
      - name: Install the pinned toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup toolchain install
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup target add aarch64-pc-windows-msvc
      - working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo xtask lint --locked --verbose --target aarch64-pc-windows-msvc

  macos:
    name: macOS clippy
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: "false"
      - run: cargo xtask lint --locked --verbose

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Name the temporary folder by its real path
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --profile ci --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --no-default-features
      - if: ${{ !cancelled() }}
        run: cargo nextest run --locked --profile ci -p resonate --no-default-features --features mcp -E 'test(/^signals::/)'

  macos-window:
    name: macOS window tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: "false"
      - name: Name the temporary folder by its real path
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --profile ci -p resonate -p resonate-ui

  server-package:
    name: Sync server package
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rustup cargo-nextest
      - uses: actions/checkout@v7
      - name: Build the package from this checkout
        run: |
          useradd --create-home builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/checkout
          sed -i 's|git+$url.git|git+file:///home/builder/checkout|' /home/builder/checkout/packaging/server/PKGBUILD
          chown -R builder:builder /home/builder
          runuser -u builder -- rustup toolchain install stable --profile minimal
          cd /home/builder/checkout/packaging/server
          runuser -u builder -- makepkg -f --noconfirm

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install the Android toolchains
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;30.0.16248370"
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> android/.cargo-target
          shared-key: android
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and lint Android
        run: android/gradlew -p android :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Enforce Android dependencies and Rust checks
        run: |
          tree=$(cargo tree -p resonate-mobile --target x86_64-linux-android --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(resonate-pipewire|pipewire|libspa|gpui|resonate-mpris|resonate-discord) '; then
            exit 1
          fi
          python3 android/check-native.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v7
        with:
          name: resonate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-release:
    name: Android release APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install the Android toolchains
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;30.0.16248370"
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build and check the release variant
        run: |
          android/gradlew -p android :app:assembleRelease
          python3 android/check-release.py --sdk "$ANDROID_HOME"

  android-emulator:
    name: Android emulator (API ${{ matrix.api }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install the Android toolchains
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;30.0.16248370"
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> android/.cargo-target
          shared-key: android
          save-if: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build the debug and test APKs for the emulator
        run: android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest -Presonate.debugAbis=x86_64
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: android/gradlew -p android :app:connectedDebugAndroidTest -Presonate.debugAbis=x86_64
      - name: Print the failing Android tests on API ${{ matrix.api }}
        if: always()
        run: python3 android/print-failures.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resonate-android-tests-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
