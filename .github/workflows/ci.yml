name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: ""
  ARCH_PACKAGES: >-
    base-devel git rustup clang pkgconf pipewire libpipewire wayland libxkbcommon libxkbcommon-x11
    fontconfig freetype2 vulkan-headers vulkan-icd-loader ffmpeg flac wavpack mac lame dbus

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --exclude resonate-ui --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked -p resonate --all-targets --no-default-features --features online,mcp,discord,sync -- -D warnings
      - name: Lint the binary with each feature alone
        shell: bash
        run: |
          set -euo pipefail
          for feature in ui online mcp discord sync; do
            cargo clippy --locked -p resonate --all-targets --no-default-features --features "$feature" -- -D warnings
          done

  headless:
    name: Tests without the window
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace --exclude resonate-ui --no-default-features
      - run: cargo test --locked --workspace --exclude resonate-ui --no-default-features
      - run: dbus-run-session -- cargo test --locked -p resonate-mpris --test bus

  workspace:
    name: Tests with everything
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  costs:
    name: DSP costs under their ceilings
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked -p resonate-dsp --bench stages
        env:
          RESONATE_BENCH_CEILINGS: "1"

  layering:
    name: Crate layering
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Refuse the dependencies each crate must stay free of
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          held_by() {
            cargo tree --locked "$@" --prefix none --format '{p}' | awk '{print $1}' | sort -u
          }
          check() {
            local named=$1 held=$2
            shift 2
            for banned in "$@"; do
              if grep -qx "$banned" <<<"$held"; then
                echo "::error::$named depends on $banned"
                failed=1
              fi
            done
          }
          refuse() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate")
            check "$crate" "$held" "$@"
          }
          refuse_headless() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate" --no-default-features)
            check "$crate without its default features" "$held" "$@"
          }
          only() {
            local crate=$1 reached
            shift
            for reached in $(held_by -p "$crate" -e normal | grep '^resonate' | grep -vx "$crate" || true); do
              if ! printf '%s\n' "$@" | grep -qx "$reached"; then
                echo "::error::$crate reaches $reached"
                failed=1
              fi
            done
          }
          reached_by_the_binary_alone() {
            local crate=$1 by
            for by in $(held_by --workspace -i "$crate" | grep '^resonate' | grep -vx "$crate" || true); do
              if [ "$by" != resonate ]; then
                echo "::error::$crate is reached by $by"
                failed=1
              fi
            done
          }
          refuse resonate-core symphonia pipewire gpui serde
          refuse resonate-library ureq serde serde_json quinn tokio
          refuse resonate-eq gpui resonate-engine resonate-library ureq
          refuse resonate-vault gpui resonate-engine resonate-library ureq
          refuse resonate-codec resonate-dsp resonate-pipewire
          refuse resonate-dsp resonate-eq resonate-codec resonate-pipewire
          refuse resonate-pipewire resonate-codec resonate-dsp
          refuse resonate-providers gpui
          refuse resonate-fetch gpui
          refuse resonate-inbox gpui
          refuse resonate-subsonic gpui
          refuse resonate-tidal gpui
          refuse resonate-monochrome gpui
          only resonate-providers resonate-core
          only resonate-fetch resonate-core resonate-providers
          only resonate-inbox resonate-core resonate-providers
          only resonate-subsonic resonate-core resonate-providers resonate-fetch
          only resonate-tidal resonate-core resonate-providers resonate-fetch
          only resonate-monochrome resonate-core resonate-providers resonate-fetch
          only resonate-audio resonate-core
          refuse resonate-audio pipewire libspa resonate-codec resonate-dsp gpui
          refuse resonate-bindgen resonate-core resonate-engine pipewire gpui
          refuse resonate-analysis gpui resonate-engine resonate-library ureq
          refuse resonate-discord gpui resonate-library ureq
          refuse resonate-listen gpui ureq
          only resonate-listen resonate-core resonate-audio resonate-pipewire
          refuse resonate-lyrics gpui resonate-engine resonate-library ureq
          refuse resonate-mpris gpui resonate-library
          check "resonate-mpris outside its tests" "$(held_by -p resonate-mpris -e normal --depth 1)" resonate-codec
          refuse resonate-mcp gpui resonate-ui resonate-online
          for by in $(held_by --workspace -i resonate-online | grep '^resonate' | grep -vx resonate-online || true); do
            case "$by" in
              resonate|resonate-mobile) ;;
              *) echo "::error::resonate-online is reached by $by"; failed=1 ;;
            esac
          done
          refuse resonate-sync gpui resonate-library resonate-engine ureq serde serde_json
          only resonate-sync resonate-core
          refuse resonate-server gpui resonate-library resonate-engine ureq serde serde_json
          only resonate-server resonate-core resonate-sync
          for by in $(held_by --workspace -i resonate-sync | grep '^resonate' | grep -vx resonate-sync || true); do
            case "$by" in
              resonate|resonate-mobile|resonate-server) ;;
              *) echo "::error::resonate-sync is reached by $by"; failed=1 ;;
            esac
          done
          reached_by_the_binary_alone resonate-mcp
          reached_by_the_binary_alone resonate-discord
          refuse_headless resonate serde_json gpui ureq quinn tokio
          check "resonate-mobile on iOS" "$(held_by -p resonate-mobile --target aarch64-apple-ios)" \
            resonate-pipewire pipewire libspa gpui resonate-mpris resonate-discord oboe
          exit "$failed"

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  android:
    name: Android APK and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android toolchains
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> android/.cargo-target
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Check Flutter
        working-directory: android/flutter
        run: flutter pub get && flutter analyze && flutter test
      - name: Build and lint Android
        run: android/gradlew -p android :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Enforce Android dependencies and Rust checks
        run: |
          tree=$(cargo tree -p resonate-mobile --target x86_64-linux-android --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(resonate-pipewire|pipewire|libspa|gpui|resonate-mpris|resonate-discord) '; then
            exit 1
          fi
          python3 android/check-native.py --sdk "$ANDROID_HOME"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: android/gradlew -p android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: resonate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
