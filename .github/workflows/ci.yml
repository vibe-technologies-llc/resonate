name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: ""
  ARCH_PACKAGES: >-
    base-devel git rustup clang pkgconf pipewire libpipewire wayland libxkbcommon libxkbcommon-x11
    fontconfig freetype2 ttf-dejavu vulkan-headers vulkan-icd-loader ffmpeg flac wavpack mac lame dbus
    webkit2gtk-4.1

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --exclude resonate-ui --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked -p resonate --all-targets --no-default-features --features online,mcp,discord,sync -- -D warnings
      - name: Lint the binary with each feature alone
        shell: bash
        run: |
          set -euo pipefail
          for feature in ui online mcp discord sync; do
            cargo clippy --locked -p resonate --all-targets --no-default-features --features "$feature" -- -D warnings
          done

  headless:
    name: Tests without the window
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --exclude resonate-ui --no-default-features
      - run: dbus-run-session -- cargo test --locked -p resonate-mpris --test bus --no-default-features

  workspace:
    name: Tests with everything
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p resonate -p resonate-ui

  costs:
    name: DSP costs under their ceilings
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked -p resonate-dsp --bench stages
        env:
          RESONATE_BENCH_CEILINGS: "1"

  layering:
    name: Crate layering
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install what cargo tree needs
        run: pacman -Syu --noconfirm --needed git rustup
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Refuse the dependencies each crate must stay free of
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          held_by() {
            cargo tree --locked "$@" --prefix none --format '{p}' | awk '{print $1}' | sort -u
          }
          check() {
            local named=$1 held=$2
            shift 2
            for banned in "$@"; do
              if grep -qx "$banned" <<<"$held"; then
                echo "::error::$named depends on $banned"
                failed=1
              fi
            done
          }
          refuse() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate")
            check "$crate" "$held" "$@"
          }
          refuse_headless() {
            local crate=$1 held
            shift
            held=$(held_by -p "$crate" --no-default-features)
            check "$crate without its default features" "$held" "$@"
          }
          only() {
            local crate=$1 reached
            shift
            for reached in $(held_by -p "$crate" -e normal | grep '^resonate' | grep -vx "$crate" || true); do
              if ! printf '%s\n' "$@" | grep -qx "$reached"; then
                echo "::error::$crate reaches $reached"
                failed=1
              fi
            done
          }
          reached_by_the_binary_alone() {
            local crate=$1 by
            for by in $(held_by --workspace -i "$crate" | grep '^resonate' | grep -vx "$crate" || true); do
              if [ "$by" != resonate ]; then
                echo "::error::$crate is reached by $by"
                failed=1
              fi
            done
          }
          only_on() {
            local target=$1 crate=$2 reached
            shift 2
            for reached in $(held_by -p "$crate" --target "$target" -e normal | grep '^resonate' | grep -vx "$crate" || true); do
              if ! printf '%s\n' "$@" | grep -qx "$reached"; then
                echo "::error::$crate on $target reaches $reached"
                failed=1
              fi
            done
          }
          reached_directly_on() {
            local target=$1 crate=$2 by
            shift 2
            for by in $(held_by --workspace -i "$crate" --target "$target" --depth 1 | grep '^resonate' | grep -vx "$crate" || true); do
              if ! printf '%s\n' "$@" | grep -qx "$by"; then
                echo "::error::$crate on $target is reached by $by"
                failed=1
              fi
            done
          }
          refuse resonate-core symphonia pipewire gpui serde
          refuse resonate-library ureq serde serde_json quinn tokio
          refuse resonate-eq gpui resonate-engine resonate-library ureq
          refuse resonate-vault gpui resonate-engine resonate-library ureq
          refuse resonate-codec resonate-dsp resonate-pipewire
          refuse resonate-dsp resonate-eq resonate-codec resonate-pipewire
          refuse resonate-pipewire resonate-codec resonate-dsp
          refuse resonate-providers gpui
          refuse resonate-fetch gpui
          refuse resonate-inbox gpui
          refuse resonate-jellyfin gpui
          refuse resonate-subsonic gpui
          refuse resonate-tidal gpui
          refuse resonate-monochrome gpui
          refuse resonate-ytmusic gpui
          only resonate-words
          only resonate-words-build
          only resonate-providers resonate-core resonate-words
          only resonate-fetch resonate-core resonate-providers resonate-words
          only resonate-inbox resonate-core resonate-providers resonate-words
          only resonate-jellyfin resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-subsonic resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-tidal resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-monochrome resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-ytmusic resonate-core resonate-providers resonate-fetch resonate-words
          only resonate-audio resonate-core resonate-words
          refuse resonate-audio pipewire libspa resonate-codec resonate-dsp gpui
          only resonate-upnp resonate-core resonate-audio resonate-words
          check "resonate-upnp outside its tests" "$(held_by -p resonate-upnp -e normal)" \
            pipewire libspa gpui ureq serde rustls
          only resonate-cast resonate-core resonate-audio resonate-upnp resonate-words
          check "resonate-cast outside its tests" "$(held_by -p resonate-cast -e normal)" \
            pipewire libspa gpui ureq serde serde_json
          for by in $(held_by --workspace -i resonate-cast | grep '^resonate' | grep -vx resonate-cast || true); do
            case "$by" in
              resonate|resonate-mobile) ;;
              *) echo "::error::resonate-cast is reached by $by"; failed=1 ;;
            esac
          done
          refuse resonate-bindgen resonate-core resonate-engine pipewire gpui
          refuse resonate-analysis gpui resonate-engine resonate-library ureq
          refuse resonate-discord gpui resonate-library ureq
          refuse resonate-listen gpui ureq
          only resonate-listen resonate-core resonate-audio resonate-pipewire resonate-words
          refuse resonate-lyrics gpui resonate-engine resonate-library ureq
          refuse resonate-mpris gpui resonate-library
          check "resonate-mpris outside its tests" "$(held_by -p resonate-mpris -e normal --depth 1)" resonate-codec
          refuse resonate-mcp gpui resonate-ui resonate-online
          for by in $(held_by --workspace -i resonate-online | grep '^resonate' | grep -vx resonate-online || true); do
            case "$by" in
              resonate|resonate-mobile) ;;
              *) echo "::error::resonate-online is reached by $by"; failed=1 ;;
            esac
          done
          refuse resonate-musicbrainz gpui resonate-engine resonate-online resonate-sync ureq serde serde_json quinn tokio
          for by in $(held_by --workspace -i resonate-musicbrainz | grep '^resonate' | grep -vx resonate-musicbrainz || true); do
            case "$by" in
              resonate|resonate-mobile) ;;
              *) echo "::error::resonate-musicbrainz is reached by $by"; failed=1 ;;
            esac
          done
          refuse resonate-sync gpui resonate-library resonate-engine ureq serde serde_json
          only resonate-sync resonate-core resonate-words
          refuse resonate-server gpui resonate-library resonate-engine
          only resonate-server resonate-core resonate-sync resonate-providers resonate-fetch resonate-tidal resonate-words
          for by in $(held_by --workspace -i resonate-sync | grep '^resonate' | grep -vx resonate-sync || true); do
            case "$by" in
              resonate|resonate-driven|resonate-mobile|resonate-server) ;;
              *) echo "::error::resonate-sync is reached by $by"; failed=1 ;;
            esac
          done
          refuse resonate-driven gpui resonate-library ureq serde serde_json
          for by in $(held_by --workspace -i resonate-driven | grep '^resonate' | grep -vx resonate-driven || true); do
            case "$by" in
              resonate|resonate-mobile) ;;
              *) echo "::error::resonate-driven is reached by $by"; failed=1 ;;
            esac
          done
          reached_by_the_binary_alone resonate-mcp
          reached_by_the_binary_alone resonate-discord
          refuse_headless resonate serde_json gpui ureq quinn tokio
          refuse resonate wry tao webkit2gtk webview2-com
          refuse_headless resonate wry tao webkit2gtk webview2-com
          only resonate-signin resonate-core resonate-words
          reached_by_the_binary_alone resonate-signin
          only resonate-cli resonate-words
          reached_by_the_binary_alone resonate-cli
          refuse resonate-pipewire resonate-wasapi
          refuse resonate-wasapi resonate-codec resonate-dsp resonate-pipewire pipewire libspa gpui
          only resonate-wasapi resonate-core resonate-audio resonate-words
          for reached in $(held_by -p resonate-win32 --target x86_64-pc-windows-msvc -e normal | grep '^resonate' | grep -vx resonate-win32 || true); do
            echo "::error::resonate-win32 reaches $reached"
            failed=1
          done
          for by in $(held_by --workspace -i resonate-win32 --target x86_64-pc-windows-msvc --depth 1 | grep '^resonate' | grep -vx resonate-win32 || true); do
            case "$by" in
              resonate|resonate-wasapi|resonate-codec) ;;
              *) echo "::error::resonate-win32 is reached by $by"; failed=1 ;;
            esac
          done
          check "resonate-listen on Windows" "$(held_by -p resonate-listen --target x86_64-pc-windows-msvc -e normal)" \
            resonate-pipewire resonate-wasapi pipewire libspa gpui ureq
          check "resonate on Windows" "$(held_by -p resonate --target x86_64-pc-windows-msvc)" \
            resonate-pipewire pipewire libspa wayland-client wayland-protocols rustix
          check "resonate-mobile on iOS" "$(held_by -p resonate-mobile --target aarch64-apple-ios)" \
            resonate-pipewire pipewire libspa gpui resonate-mpris resonate-discord oboe
          refuse resonate-coreaudio resonate-codec resonate-dsp resonate-pipewire resonate-wasapi pipewire libspa gpui
          only resonate-coreaudio resonate-core resonate-audio resonate-apple resonate-words
          only_on aarch64-apple-darwin resonate-coreaudio resonate-core resonate-audio resonate-apple resonate-words
          only_on aarch64-apple-darwin resonate-apple
          only_on aarch64-apple-ios resonate-apple
          reached_directly_on aarch64-apple-darwin resonate-apple resonate-codec resonate-coreaudio resonate-listen resonate-mobile resonate-mpris
          reached_directly_on aarch64-apple-ios resonate-apple resonate-coreaudio resonate-mobile
          only_on aarch64-apple-darwin resonate-listen resonate-core resonate-audio resonate-apple resonate-dsp resonate-words
          check "resonate-listen on macOS" "$(held_by -p resonate-listen --target aarch64-apple-darwin -e normal)" \
            resonate-pipewire resonate-wasapi resonate-coreaudio pipewire libspa gpui ureq
          check "resonate on macOS" "$(held_by -p resonate --target aarch64-apple-darwin)" \
            resonate-pipewire resonate-wasapi resonate-win32 pipewire libspa wayland-client wayland-protocols wasapi windows
          exit "$failed"

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire -- -D warnings
      - run: cargo clippy --locked --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked -p resonate --all-targets --no-default-features --features online,mcp,discord,sync -- -D warnings
      - name: Lint the binary with each feature alone
        shell: bash
        run: |
          set -euo pipefail
          for feature in ui online mcp discord sync; do
            cargo clippy --locked -p resonate --all-targets --no-default-features --features "$feature" -- -D warnings
          done
      - run: cargo test --locked --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --no-default-features
      - run: cargo test --locked -p resonate --no-default-features --features mcp --test signals

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=generic -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --target aarch64-pc-windows-msvc --workspace --all-targets --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire -- -D warnings
      - run: cargo clippy --locked --target aarch64-pc-windows-msvc --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --target aarch64-pc-windows-msvc -p resonate --all-targets --no-default-features --features online,mcp,discord,sync -- -D warnings
      - name: Lint the binary with each feature alone
        shell: bash
        run: |
          set -euo pipefail
          for feature in ui online mcp discord sync; do
            cargo clippy --locked --target aarch64-pc-windows-msvc -p resonate --all-targets --no-default-features --features "$feature" -- -D warnings
          done

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire -- -D warnings
      - run: cargo clippy --locked --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked -p resonate --all-targets --no-default-features --features online,mcp,discord,sync -- -D warnings
      - name: Lint the binary with each feature alone
        shell: bash
        run: |
          set -euo pipefail
          for feature in ui online mcp discord sync; do
            cargo clippy --locked -p resonate --all-targets --no-default-features --features "$feature" -- -D warnings
          done
      - name: Name the temporary folder by its real path
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - run: cargo test --locked --no-fail-fast --workspace --exclude resonate-ui --exclude resonate-mobile --exclude resonate-bindgen --exclude resonate-pipewire --exclude resonate-engine --no-default-features
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p resonate-engine --no-default-features -- --test-threads=1
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p resonate --no-default-features --features mcp --test signals
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p resonate -p resonate-ui

  server-package:
    name: Sync server package
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rustup
      - uses: actions/checkout@v7
      - name: Build the package from this checkout
        run: |
          useradd --create-home builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/checkout
          sed -i 's|git+$url.git|git+file:///home/builder/checkout|' /home/builder/checkout/packaging/server/PKGBUILD
          chown -R builder:builder /home/builder
          runuser -u builder -- rustup toolchain install stable --profile minimal
          cd /home/builder/checkout/packaging/server
          runuser -u builder -- makepkg -f --noconfirm

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-26.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v7
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  android:
    name: Android APK and emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install the Android toolchains
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> android/.cargo-target
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and lint Android
        run: android/gradlew -p android :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Enforce Android dependencies and Rust checks
        run: |
          tree=$(cargo tree -p resonate-mobile --target x86_64-linux-android --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(resonate-pipewire|pipewire|libspa|gpui|resonate-mpris|resonate-discord) '; then
            exit 1
          fi
          python3 android/check-native.py --sdk "$ANDROID_HOME"
      - name: Build and check the release variant
        run: |
          android/gradlew -p android :app:assembleRelease
          python3 android/check-release.py --sdk "$ANDROID_HOME"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: android/gradlew -p android :app:connectedDebugAndroidTest
      - name: Print the failing Android tests on API 33
        if: always()
        run: python3 android/print-failures.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resonate-android-tests-api-33
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: android/gradlew -p android :app:connectedDebugAndroidTest
      - name: Print the failing Android tests on API 36
        if: always()
        run: python3 android/print-failures.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resonate-android-tests-api-36
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: resonate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
