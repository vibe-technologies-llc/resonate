[package]
name = "resonate-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
bytemuck.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
jiff.workspace = true
parking_lot.workspace = true
resonate-words.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }
same-file.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-always", "tzdb-concatenated"] }

[target.'cfg(target_os = "ios")'.dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-always"] }

[build-dependencies]
resonate-words-build.workspace = true

[dev-dependencies]
proptest.workspace = true
resonate-words-build.workspace = true

[lints]
workspace = true
