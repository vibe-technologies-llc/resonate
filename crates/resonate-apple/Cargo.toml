[package]
name = "resonate-apple"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-audio-toolbox.workspace = true
objc2-core-audio-types.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = {
    version = "0.3.2",
    default-features = false,
    features = [
        "std",
        "AudioHardware",
        "objc2-core-audio-types"
    ]
}
objc2-core-foundation = {
    version = "0.3.2",
    default-features = false,
    features = [
        "std",
        "CFCGTypes",
        "CFString"
    ]
}
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = {
    version = "0.3.2",
    default-features = false,
    features = [
        "std",
        "NSImage",
        "objc2-core-foundation"
    ]
}
objc2-foundation = {
    version = "0.3.2",
    default-features = false,
    features = [
        "std",
        "NSData",
        "NSDictionary",
        "NSObject",
        "NSString",
        "NSValue",
        "objc2-core-foundation"
    ]
}
objc2-media-player = {
    version = "0.3.2",
    default-features = false,
    features = [
        "std",
        "MPMediaEntity",
        "MPMediaItem",
        "MPNowPlayingInfoCenter",
        "MPRemoteCommand",
        "MPRemoteCommandCenter",
        "MPRemoteCommandEvent",
        "block2",
        "objc2-app-kit",
        "objc2-core-foundation"
    ]
}
parking_lot.workspace = true

[dev-dependencies]
objc2-core-audio-types.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
result_large_err = "deny"
