[package]
name = "resonate-mpris"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
ahash.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
resonate-core.workspace = true
resonate-engine.workspace = true
resonate-words.workspace = true
thiserror.workspace = true
tracing.workspace = true
zbus.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
resonate-apple.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
wasapi.workspace = true
windows = {
    workspace = true,
    features = [
        "Data_Xml_Dom",
        "Foundation",
        "Media",
        "Media_Playback",
        "Networking_Connectivity",
        "Storage",
        "Storage_Streams",
        "UI_Notifications"
    ]
}

[build-dependencies]
resonate-words-build.workspace = true

[dev-dependencies]
resonate-words-build.workspace = true
resonate-codec.workspace = true
zbus = { workspace = true, features = ["object-manager"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
