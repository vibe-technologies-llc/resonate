[package]
name = "resonate-mpris"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
ahash.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
resonate-core.workspace = true
resonate-engine.workspace = true
thiserror.workspace = true
tracing.workspace = true
zbus.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
wasapi = "0.26.0"
windows = {
    version = "0.62.2",
    default-features = false,
    features = [
        "Data_Xml_Dom",
        "Foundation",
        "Media",
        "Media_Playback",
        "Networking_Connectivity",
        "Storage",
        "Storage_Streams",
        "UI_Notifications"
    ]
}

[dev-dependencies]
resonate-codec.workspace = true
zbus = { workspace = true, features = ["object-manager"] }

[lints]
workspace = true
