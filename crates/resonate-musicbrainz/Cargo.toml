[package]
name = "resonate-musicbrainz"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
doctest = false

[features]
download = ["dep:resonate-fetch", "dep:sha2", "dep:ureq"]

[dependencies]
mibz2 = "0.5.3"
parking_lot.workspace = true
resonate-core.workspace = true
resonate-fetch = { workspace = true, optional = true }
resonate-library.workspace = true
rusqlite.workspace = true
sha2 = { workspace = true, optional = true }
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
tracing.workspace = true
ureq = { workspace = true, optional = true }
zstd = { workspace = true, features = ["zdict_builder"] }

[dev-dependencies]
bzip2 = "0.6.1"

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
