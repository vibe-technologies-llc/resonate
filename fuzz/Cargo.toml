[package]
name = "resonate-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }
resonate-analysis.path = "../crates/resonate-analysis"
resonate-cast.path = "../crates/resonate-cast"
resonate-core.path = "../crates/resonate-core"
resonate-codec.path = "../crates/resonate-codec"
resonate-eq.path = "../crates/resonate-eq"
resonate-library.path = "../crates/resonate-library"
resonate-lyrics.path = "../crates/resonate-lyrics"
resonate-mcp.path = "../crates/resonate-mcp"
resonate-mpris.path = "../crates/resonate-mpris"
resonate-musicbrainz.path = "../crates/resonate-musicbrainz"
resonate-online.path = "../crates/resonate-online"
resonate-server.path = "../crates/resonate-server"
resonate-tidal.path = "../crates/providers/tidal"
resonate-upnp.path = "../crates/resonate-upnp"
resonate-vault.path = "../crates/resonate-vault"
resonate-sync.path = "../crates/resonate-sync"

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false
bench = false

