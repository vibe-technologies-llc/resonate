[workspace]
resolver = "3"
members = [
    "crates/resonate",
    "crates/resonate-analysis",
    "crates/resonate-core",
    "crates/resonate-codec",
    "crates/resonate-discord",
    "crates/resonate-dsp",
    "crates/resonate-pipewire",
    "crates/resonate-engine",
    "crates/resonate-eq",
    "crates/resonate-library",
    "crates/resonate-listen",
    "crates/resonate-lyrics",
    "crates/resonate-mcp",
    "crates/resonate-mpris",
    "crates/resonate-online",
    "crates/resonate-providers",
    "crates/providers/inbox",
    "crates/resonate-ui",
    "crates/resonate-vault"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
result_large_err = "deny"

[workspace.dependencies]
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
ahash = { version = "0.8.12", default-features = false, features = ["std", "runtime-rng"] }
parking_lot = { version = "0.12.5", default-features = false }
notify = { version = "8.2.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }
crossbeam-channel = { version = "0.5.17", default-features = false, features = ["std"] }
futures-channel = { version = "0.3.34", default-features = false, features = ["alloc"] }
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
rtrb = { version = "0.4.0", default-features = false, features = ["std"] }
smallvec = { version = "1.16.1", default-features = false, features = ["union", "const_generics"] }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
image = {
    version = "0.25.10",
    default-features = false,
    features = ["bmp", "gif", "jpeg", "png", "webp"]
}

rustfft = { version = "6.4.1", default-features = false, features = ["avx", "sse", "neon"] }
rusty-chromaprint = { version = "0.3.0", default-features = false }

proptest = { version = "1.11.0", default-features = false, features = ["std"] }

symphonia = {
    version = "0.6.1",
    default-features = false,
    features = [
        "aac",
        "aiff",
        "alac",
        "caf",
        "flac",
        "mp3",
        "pcm",
        "vorbis",
        "isomp4",
        "mkv",
        "ogg",
        "wav",
        "ape",
        "id3v1",
        "id3v2",
        "opt-simd"
    ]
}

opus-rs = { version = "0.1.34", default-features = false, features = ["std", "heap"] }

lofty = { version = "0.25.4", default-features = false, features = ["id3v2_compression_support"] }

flacenc = { version = "0.5.1", default-features = false, features = ["par"] }
zstd = { version = "0.14.0", default-features = false }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std", "threads"] }
jxl-oxide = { version = "0.12.6", default-features = false }

pipewire = { version = "0.10.1", default-features = false, features = ["v0_3_50"] }
libspa = { version = "0.10.1", default-features = false }

rusqlite = {
    version = "0.40.2",
    default-features = false,
    features = ["bundled", "cache", "hooks"]
}

toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }

ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
uuid = { version = "1.26.1", default-features = false, features = ["std", "v4"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

gpui = { version = "0.2.2", default-features = false, features = ["wayland", "font-kit"] }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = {
    version = "0.32.13",
    default-features = false,
    features = ["client", "staging"]
}

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = {
    version = "0.3.23",
    default-features = false,
    features = [
        "std",
        "fmt",
        "ansi",
        "env-filter",
        "tracing-log"
    ]
}
clap_complete = { version = "4.6.11", default-features = false }
clap_mangen = { version = "0.3.3", default-features = false }
clap = {
    version = "4.6.7",
    default-features = false,
    features = [
        "std",
        "derive",
        "help",
        "usage",
        "error-context",
        "suggestions"
    ]
}

resonate-analysis = { version = "0.1.0", path = "crates/resonate-analysis" }
resonate-core = { version = "0.1.0", path = "crates/resonate-core" }
resonate-codec = { version = "0.1.0", path = "crates/resonate-codec" }
resonate-discord = { version = "0.1.0", path = "crates/resonate-discord" }
resonate-dsp = { version = "0.1.0", path = "crates/resonate-dsp" }
resonate-pipewire = { version = "0.1.0", path = "crates/resonate-pipewire" }
resonate-engine = { version = "0.1.0", path = "crates/resonate-engine" }
resonate-eq = { version = "0.1.0", path = "crates/resonate-eq" }
resonate-library = { version = "0.1.0", path = "crates/resonate-library" }
resonate-listen = { version = "0.1.0", path = "crates/resonate-listen" }
resonate-lyrics = { version = "0.1.0", path = "crates/resonate-lyrics" }
resonate-mcp = { version = "0.1.0", path = "crates/resonate-mcp" }
resonate-mpris = { version = "0.1.0", path = "crates/resonate-mpris" }
resonate-online = { version = "0.1.0", path = "crates/resonate-online" }
resonate-providers = { version = "0.1.0", path = "crates/resonate-providers" }
resonate-inbox = { version = "0.1.0", path = "crates/providers/inbox" }
resonate-ui = { version = "0.1.0", path = "crates/resonate-ui" }
resonate-vault = { version = "0.1.0", path = "crates/resonate-vault" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.resonate-dsp]
opt-level = 3

[profile.dev.package.resonate-codec]
opt-level = 3

[profile.dev.package.resonate-analysis]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rusty-chromaprint]
opt-level = 3

[profile.dev.package.resonate-vault]
opt-level = 3

[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.zune-jpegxl]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
