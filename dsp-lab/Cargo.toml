[package]
name = "resonate-dsp-lab"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "dsp-lab"
path = "src/main.rs"

[dependencies]
clap = {
    version = "4.6.10",
    default-features = false,
    features = ["std", "derive", "help", "usage", "error-context"]
}
realfft = { version = "3.5.1", default-features = false, features = ["avx", "sse", "neon"] }
resonate-core.path = "../crates/resonate-core"
resonate-dsp.path = "../crates/resonate-dsp"
resonate-engine.path = "../crates/resonate-engine"
rubato = {
    version = "5.1.0",
    default-features = false,
    features = ["fft_resampler"],
    optional = true
}
soxr = { version = "0.6.0", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[features]
default = ["soxr", "rubato"]
soxr = ["dep:soxr"]
rubato = ["dep:rubato"]

[workspace]

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
