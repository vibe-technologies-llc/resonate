id: org.resonate.Resonate
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: resonate
rename-desktop-file: resonate.desktop
rename-icon: resonate
finish-args:
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/.flatpak/dev.vencord.Vesktop/xdg-run
  - --own-name=org.mpris.MediaPlayer2.resonate
  - "--own-name=org.mpris.MediaPlayer2.resonate.*"
  - --talk-name=org.mpris.MediaPlayer2.resonate
  - "--talk-name=org.mpris.MediaPlayer2.resonate.*"
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.bluez
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    RUSTFLAGS: "-C target-cpu=generic"
  arch:
    x86_64:
      env:
        RUSTFLAGS: "-C target-cpu=x86-64"
modules:
  - name: inter
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/fonts/inter extras/ttf/Inter-*.ttf
      - install -Dm644 LICENSE.txt /app/share/licenses/inter/LICENSE.txt
    sources:
      - type: archive
        url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
        sha256: 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
        strip-components: 0
  - name: jetbrains-mono
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/fonts/jetbrains-mono fonts/ttf/JetBrainsMono-*.ttf
      - install -Dm644 OFL.txt /app/share/licenses/jetbrains-mono/OFL.txt
    sources:
      - type: archive
        url: https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
        sha256: 6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf
        strip-components: 0
  - name: resonate
    buildsystem: simple
    build-commands:
      - cargo fetch --locked
      - cargo build --locked --release --package resonate --bin resonate
      - |
        set -eu
        generated=$(find target/release/build -name resonate.1 -printf '%h\n' -quit)
        test -n "$generated"
        install -Dm755 target/release/resonate /app/bin/resonate
        install -Dm644 packaging/resonate.desktop /app/share/applications/resonate.desktop
        install -Dm644 packaging/resonate.svg /app/share/icons/hicolor/scalable/apps/resonate.svg
        install -Dm644 packaging/org.resonate.Resonate.metainfo.xml /app/share/metainfo/org.resonate.Resonate.metainfo.xml
        install -Dm644 LICENSE /app/share/licenses/resonate/LICENSE
        install -Dm644 COPYRIGHT /app/share/licenses/resonate/COPYRIGHT
        install -Dm644 -t /app/share/man/man1 "$generated"/*.1
        install -Dm644 -t /app/share/man/man5 packaging/resonate-config.toml.5
        install -Dm644 "$generated/resonate.bash" /app/share/bash-completion/completions/resonate
        install -Dm644 "$generated/_resonate" /app/share/zsh/site-functions/_resonate
        install -Dm644 "$generated/resonate.fish" /app/share/fish/vendor_completions.d/resonate.fish
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - target
          - flatpak-build
          - fuzz/corpus
          - fuzz/artifacts
          - fuzz/target
